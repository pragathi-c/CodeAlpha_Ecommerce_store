<!DOCTYPE html>
<html>
<head>
    <title>Login - MyMart</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
        header { background: #d32f2f; color: white; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { background: #d32f2f; color: white; border: none; padding: 12px 24px; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%; }
        .errorlist { color: red; font-size: 13px; }
    </style>
</head>
<body>
    <header><h1>🛒 MyMart</h1></header>
    <div class="container">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="/register/">Register here</a></p>
    </div>
</body>
</html>
