<!DOCTYPE html>
<html>
<head>
    <title>Your Cart - MyMart</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
        header { background: #d32f2f; color: white; padding: 20px; text-align: center; }
        .container { max-width: 700px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
        .total { font-size: 20px; font-weight: bold; margin-top: 20px; text-align: right; color: #d32f2f; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #d32f2f; text-decoration: none; }
        .remove-btn { color: white; background: #999; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 13px; }
        .remove-btn:hover { background: #666; }
    </style>
</head>
<body>
    <header>
        <h1>🛒 MyMart</h1>
    </header>
    <div class="container">
        <a href="/" class="back-link">&larr; Continue shopping</a>
        <h2>Your Cart</h2>
        {% if products %}
            {% for item in products %}
                <div class="item">
                    <div>
                        <strong>{{ item.product.name }}</strong><br>
                        ₹{{ item.product.price }} × {{ item.quantity }} = ₹{{ item.subtotal }}
                    </div>
                    <a href="/cart/remove/{{ item.product.id }}/" class="remove-btn">Remove</a>
                </div>
            {% endfor %}
            <p class="total">Total: ₹{{ total }}</p>
            <a href="/checkout/"><button style="background:#d32f2f;color:white;border:none;padding:12px 24px;border-radius:5px;font-size:16px;cursor:pointer;width:100%;">Checkout</button></a>
        {% else %}
            <p>Your cart is empty.</p>
        {% endif %}
    </div>
</body>
</html>
